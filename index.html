<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السوق السوري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --green:  #1a6b3c;
  --green2: #0d4a28;
  --green3: #0a3520;
  --gold:   #c9922a;
  --gold2:  #f0b84a;
  --bg:     #0f1a14;
  --card:   #162010;
  --card2:  #1d2b1f;
  --card3:  #243323;
  --text:   #e8f0e9;
  --muted:  #7a9b82;
  --border: rgba(100,180,120,0.13);
  --glow:   rgba(26,107,60,0.35);
  --radius: 14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(26,107,60,0.15) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(201,146,42,0.08) 0%,transparent 60%);pointer-events:none;}

/* ── HEADER ── */
.header{position:sticky;top:0;z-index:100;background:rgba(15,26,20,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;height:62px;padding:0 16px;}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--green),var(--gold));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 16px var(--glow);}
.logo-text-wrap{display:flex;flex-direction:column;line-height:1.2;}
.logo-text{font-size:19px;font-weight:900;white-space:nowrap;}
.logo-text span{color:var(--gold2);}
.logo-tagline{font-size:9px;color:var(--muted);font-weight:600;white-space:nowrap;}
.search-wrap{flex:1;display:flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:50px;padding:0 14px;height:38px;gap:8px;transition:border-color .3s;min-width:0;}
.search-wrap:focus-within{border-color:var(--green);}
.search-wrap input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Cairo',sans-serif;font-size:13px;min-width:0;}
.search-wrap input::placeholder{color:var(--muted);}
.hbtn{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .2s;flex-shrink:0;}
.hbtn:hover{background:var(--green);border-color:var(--green);}

/* ── TICKER ── */
.ticker{background:linear-gradient(90deg,var(--green3),#0a3d1e,var(--green3));border-bottom:1px solid var(--border);padding:7px 0;overflow:hidden;position:relative;z-index:1;}
.ticker-label{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a0a00;font-weight:900;font-size:11px;padding:0 14px;display:flex;align-items:center;z-index:2;border-radius:0 0 0 8px;white-space:nowrap;}
.ticker-track{display:flex;white-space:nowrap;animation:tickerAnim 30s linear infinite;padding-right:160px;}
.ticker-track:hover{animation-play-state:paused;}
@keyframes tickerAnim{from{transform:translateX(50%)}to{transform:translateX(-100%)}}
.t-item{padding:0 24px;font-size:12px;color:#a8d4b4;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.t-item:hover{color:#fff;}
.t-item b{color:var(--gold2);}

/* ── HERO ── */

/* ── OFFLINE ── */
.offline-page{display:none;text-align:center;padding:80px 20px;position:relative;z-index:1;}
.offline-page h2{font-size:1.4rem;color:var(--text);margin-top:12px;}
.offline-page p{color:var(--muted);margin-top:8px;}
.offline-page button{margin-top:20px;padding:10px 28px;background:var(--green);color:#fff;border:none;border-radius:30px;font-size:14px;font-family:'Cairo',sans-serif;cursor:pointer;}

/* ── CATEGORIES ── */
.cats-section{position:relative;z-index:1;padding:0 16px 16px;}
.cats{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:1100px;margin:auto;}
.cat{flex:0 1 auto;padding:6px 14px;border-radius:50px;background:var(--card2);border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;transition:all .25s;white-space:nowrap;display:flex;align-items:center;gap:5px;line-height:1.3;}
.cat:hover{border-color:var(--green);color:var(--gold2);transform:translateY(-1px);}
.cat.active{background:linear-gradient(135deg,var(--green),var(--green2));border-color:var(--green);box-shadow:0 3px 12px var(--glow);color:#fff;}
.cat .cnt{background:rgba(255,255,255,0.15);padding:1px 6px;border-radius:20px;font-size:10px;font-weight:900;min-width:16px;text-align:center;}
@media(max-width:600px){
  .cat{font-size:11px;padding:5px 12px;}
}

/* ── GRID ── */
.grid-section{position:relative;z-index:1;padding:0 16px 100px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;max-width:1100px;margin:auto;}
.no-ads{text-align:center;padding:60px;color:var(--muted);font-size:16px;grid-column:1/-1;}

/* ── CARD ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s;cursor:pointer;position:relative;}
.card:hover{transform:translateY(-5px);border-color:rgba(100,180,120,0.3);box-shadow:0 16px 48px rgba(0,0,0,0.5),0 0 0 1px rgba(26,107,60,0.15);}
.card.pinned{border-color:rgba(201,146,42,0.35);}
.pin-tag{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0a00;font-size:10px;font-weight:900;padding:3px 10px;border-radius:20px;z-index:2;}

/* صورة */
.card-img{width:100%;height:175px;position:relative;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:50px;color:var(--muted);}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
.card:hover .card-img img{transform:scale(1.06);}
.card-img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,26,20,0.85) 0%,transparent 50%);}
.img-count{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;backdrop-filter:blur(4px);}

/* body */
.card-body{padding:12px;}
.card-tags{display:flex;align-items:center;gap:5px;margin-bottom:7px;flex-wrap:wrap;}
.tag{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;}
.tag-cat{background:rgba(26,107,60,0.25);color:#6dd98a;}
.tag-city{background:rgba(201,146,42,0.18);color:var(--gold2);}
.card-title{font-size:14px;font-weight:700;line-height:1.45;margin-bottom:7px;color:#dff0e1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-price{font-size:16px;font-weight:900;color:var(--gold2);margin-bottom:10px;}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border);}
.card-date{font-size:11px;color:var(--muted);}
.card-wa{width:30px;height:30px;border-radius:9px;background:rgba(26,107,60,0.4);display:flex;align-items:center;justify-content:center;font-size:13px;transition:.2s;}
.card:hover .card-wa{background:#25D366;}

/* ── FAB ── */
.fab-wa{position:fixed;bottom:26px;right:20px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;}
.fab-label{background:rgba(0,0,0,0.8);color:#fff;padding:4px 11px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;backdrop-filter:blur(8px);}
.fab-btn{width:56px;height:56px;border-radius:17px;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;box-shadow:0 6px 22px rgba(37,211,102,0.45);animation:glow 3s ease-in-out infinite;transition:.3s;}
.fab-btn:hover{transform:scale(1.1);}
@keyframes glow{0%,100%{box-shadow:0 6px 22px rgba(37,211,102,0.45);}50%{box-shadow:0 6px 30px rgba(37,211,102,0.7);}}
.fab-search{position:fixed;bottom:26px;left:20px;z-index:200;width:50px;height:50px;border-radius:15px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.4);transition:.3s;}
.fab-search:hover{background:var(--green);border-color:var(--green);}
.fab-support{position:fixed;bottom:88px;left:20px;z-index:200;width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(37,211,102,0.4);transition:.3s;text-decoration:none;}
.fab-support:hover{transform:scale(1.08);}

/* ── SEARCH MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;width:100%;max-width:440px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{background:linear-gradient(135deg,var(--green),var(--green2));padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;font-weight:900;color:#fff;}
.modal-close{font-size:26px;cursor:pointer;color:#fff;background:none;border:none;line-height:1;}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.field input,.field select{width:100%;padding:10px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Cairo',sans-serif;font-size:13px;outline:none;transition:border-color .3s;}
.field input:focus,.field select:focus{border-color:var(--green);}
.field select option{background:var(--card2);}
.modal-btns{display:flex;gap:10px;}
.mbtn{flex:1;padding:11px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:.2s;}
.mbtn-primary{background:var(--green);color:#fff;}
.mbtn-primary:hover{background:#1f8049;}
.mbtn-secondary{background:var(--card3);color:var(--muted);}

/* ── DETAIL MODAL ── */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1100;overflow-y:auto;}
.detail-overlay.open{display:block;}
.detail-box{background:var(--card);border:1px solid var(--border);border-radius:20px;width:90%;max-width:500px;margin:40px auto;overflow:hidden;animation:slideUp .3s ease;}
.detail-head{background:linear-gradient(135deg,var(--green),var(--green2));padding:13px 18px;display:flex;justify-content:space-between;align-items:center;}
.detail-head h3{font-size:14px;font-weight:900;color:#fff;flex:1;margin-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.detail-body{padding:18px;max-height:75vh;overflow-y:auto;}
.detail-imgs{width:100%;margin-bottom:14px;}
.main-img{width:100%;height:240px;object-fit:cover;border-radius:12px;cursor:pointer;}
.thumbs{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap;}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.2s;}
.thumb:hover,.thumb.active{border-color:var(--green);}
.no-img-box{height:160px;background:var(--card2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:14px;}
.detail-row{padding:9px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px;}
.detail-row:last-child{border:none;}
.detail-lbl{font-size:11px;font-weight:700;color:var(--muted);}
.detail-val{font-size:14px;color:var(--text);line-height:1.5;}
.contact-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;padding:12px;border-radius:12px;font-weight:900;font-size:14px;font-family:'Cairo',sans-serif;transition:.2s;}
.wa-btn:hover{background:#128C7E;}
.call-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;padding:11px;border-radius:12px;font-weight:700;font-size:13px;font-family:'Cairo',sans-serif;transition:.2s;}
.call-btn:hover{background:#1f8049;}

/* ── IMAGE FULLSCREEN ── */
.img-full{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:2000;align-items:center;justify-content:center;padding:20px;}
.img-full.open{display:flex;}
.img-full img{max-width:100%;max-height:90vh;border-radius:12px;}
.img-full-close{position:absolute;top:16px;left:16px;font-size:30px;color:#fff;cursor:pointer;background:rgba(0,0,0,0.5);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* ── ACTIVE FILTERS ── */
.active-filters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 16px 10px;max-width:1100px;margin:auto;position:relative;z-index:1;}
.filter-chip{background:var(--card2);border:1px solid var(--border);padding:4px 12px;border-radius:20px;font-size:11px;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.filter-chip .rm{cursor:pointer;color:var(--gold2);font-weight:900;}

/* ── LOADING ── */
.loading-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;max-width:1100px;margin:auto;}
.skeleton{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);}
.sk-img{height:175px;background:linear-gradient(90deg,var(--card2) 25%,var(--card3) 50%,var(--card2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
.sk-body{padding:12px;display:flex;flex-direction:column;gap:8px;}
.sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--card2) 25%,var(--card3) 50%,var(--card2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
.sk-line.w60{width:60%;}
.sk-line.w80{width:80%;}
.sk-line.w40{width:40%;}
@keyframes shimmer{to{background-position:-200% 0}}

@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
  .search-wrap{display:none;}
  .logo-text{font-size:17px;}
  .logo-tagline{display:none;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🛍️</div>
      <div class="logo-text-wrap">
        <div class="logo-text">السوق <span>السوري</span></div>
        <div class="logo-tagline">منصة الإعلانات المجانية الأولى للسوريين</div>
      </div>
    </div>
    <div class="search-wrap">
      <span>🔍</span>
      <input id="headerSearch" type="text" placeholder="ابحث عن إعلان...">
    </div>
    <div class="hbtn" onclick="openSearchModal()" title="بحث متقدم">🔍</div>
  </div>
</header>

<!-- TICKER -->
<div class="ticker">
  <div class="ticker-label">🔥 آخر الإعلانات</div>
  <div class="ticker-track" id="tickerTrack">
    <span class="t-item">⏳ جاري التحميل...</span>
  </div>
</div>

<!-- OFFLINE -->
<div class="offline-page" id="offlinePage">
  <div style="font-size:64px">📡</div>
  <h2>لا يوجد اتصال بالإنترنت</h2>
  <p>تحقق من اتصالك وأعد المحاولة</p>
  <button onclick="location.reload()">🔄 إعادة المحاولة</button>
</div>

<!-- MAIN -->
<div id="mainContent">

  <!-- CATEGORIES -->
  <div class="cats-section">
    <div class="cats" id="catsList">
      <div class="cat active" data-cat="all">الكل</div>
    </div>
  </div>

  <!-- ACTIVE FILTERS -->
  <div class="active-filters" id="activeFilters"></div>

  <!-- GRID -->
  <div class="grid-section">
    <div class="loading-grid" id="loadingGrid">
      <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w60"></div><div class="sk-line w80"></div><div class="sk-line w40"></div></div></div>
      <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
      <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w60"></div><div class="sk-line w80"></div><div class="sk-line w40"></div></div></div>
    </div>
    <div class="grid" id="adsGrid" style="display:none"></div>
  </div>

</div>

<!-- FAB -->
<div class="fab-wa">
  <div class="fab-label">📢 أرسل إعلانك مجاناً</div>
  <a id="waFab" href="#" class="fab-btn">📲</a>
</div>
<div class="fab-search" onclick="openSearchModal()">🔍</div>
<a class="fab-support" id="supportFab" href="#" target="_blank" title="الدعم الفني">🎧</a>

<!-- SEARCH MODAL -->
<div class="modal-overlay" id="searchModal" onclick="closeIfOut(event,'searchModal')">
  <div class="modal-box">
    <div class="modal-head">
      <h3>🔍 بحث متقدم</h3>
      <button class="modal-close" onclick="closeModal('searchModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>🔎 كلمة البحث</label><input id="sKeyword" type="text" placeholder="عنوان، وصف، سعر..."></div>
      <div class="field"><label>📍 المدينة</label><select id="sCity"><option value="all">جميع المدن</option></select></div>
      <div class="modal-btns">
        <button class="mbtn mbtn-primary" onclick="applySearch()">🔍 بحث</button>
        <button class="mbtn mbtn-secondary" onclick="resetSearch()">↺ إعادة تعيين</button>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="detail-overlay" id="detailModal" onclick="closeDetailIfOut(event)">
  <div class="detail-box">
    <div class="detail-head">
      <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
      <h3 id="detailTitle">تفاصيل الإعلان</h3>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- IMAGE FULLSCREEN -->
<div class="img-full" id="imgFull" onclick="closeModal('imgFull')">
  <div class="img-full-close" onclick="closeModal('imgFull')">✕</div>
  <img id="imgFullSrc" src="" alt="">
</div>

<script>
const ADMIN_WA = "963981091798";
const CITIES = ['دمشق','حلب','حمص','حماة','اللاذقية','طرطوس','دير الزور','الحسكة','السويداء','درعا','إدلب','الرقة','القنيطرة','ريف دمشق','قدسيا','جرمانا','دوما','حرستا','داريا','التل','الزبداني','يبرود','النابك','قطنا','معضمية الشام','الميادين','البوكمال','عين العرب','عفرين','الباب','منبج','جرابلس','رأس العين','القامشلي','عامودا','المالكية','الدرباسية','جسر الشغور','معرة النعمان','خان شيخون','أريحا','سلمية','مصياف','السقيلبية','محردة','كفرزيتا','بانياس','جبلة','القرداحة','الحفة','صافيتا','الشيخ بدر'];
const CAT_ICONS = {'عقارات':'🏠','سيارات':'🚗','وظائف':'💼','أدوات منزلية':'🔧','مستعمل':'♻️','موبايلات':'📱','الكترونيات':'💻','تعليم':'🎓','مفروشات':'🛋️','غذائيات':'🍽️','يدويات':'🤝','ملابس':'👕','دراجات':'🏍️','خدمات نقل':'🚚'};

let allAds=[], cats=[], curCat='all', curSearch='', curCity='all';

// ── Online/Offline ──
function checkOnline(){
  if(!navigator.onLine){
    document.getElementById('offlinePage').style.display='block';
    document.getElementById('mainContent').style.display='none';
  } else {
    document.getElementById('offlinePage').style.display='none';
    document.getElementById('mainContent').style.display='block';
  }
}
window.addEventListener('online',()=>{checkOnline();loadData();});
window.addEventListener('offline',checkOnline);
checkOnline();

// ── Load Data ──
async function loadData(){
  try {
    const res  = await fetch('ads.json?v='+Date.now());
    const data = await res.json();
    allAds = data.ads||[];
    cats   = data.categories||[];

    // تصفية المنتهية
    const today = new Date().toISOString().split('T')[0];
    allAds = allAds.filter(a=>!a.expiry_date||a.expiry_date>=today);

    // إحصائيات
    const cities = new Set(allAds.map(a=>a.city).filter(Boolean));

    // مدن البحث
    const sel = document.getElementById('sCity');
    sel.innerHTML = '<option value="all">جميع المدن</option>';
    CITIES.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});

    // واتساب
    const msg = encodeURIComponent("مرحباً، أريد إضافة إعلان جديد\n\n📌 العنوان: \n📝 الوصف: \n💰 السعر: \n📍 المدينة: \n📞 التواصل: ");
    document.getElementById('waFab').href = `https://wa.me/${ADMIN_WA}?text=${msg}`;

    // زر الدعم الفني
    const supportMsg = encodeURIComponent("مرحباً، أحتاج مساعدة بخصوص تطبيق السوق السوري");
    document.getElementById('supportFab').href = `https://wa.me/${ADMIN_WA}?text=${supportMsg}`;

    buildTicker();
    buildCats();
    renderAds();

    document.getElementById('loadingGrid').style.display='none';
    document.getElementById('adsGrid').style.display='grid';

    // بحث header
    document.getElementById('headerSearch').addEventListener('input', e=>{
      curSearch = e.target.value;
      document.getElementById('sKeyword').value = curSearch;
      renderAds(); updateFilters();
    });

  } catch(e) {
    if(!navigator.onLine) checkOnline();
    else {
      document.getElementById('loadingGrid').style.display='none';
      document.getElementById('adsGrid').style.display='grid';
      document.getElementById('adsGrid').innerHTML='<div class="no-ads">⚠️ خطأ في تحميل البيانات</div>';
    }
  }
}

// ── Ticker ──
function buildTicker(){
  const last = allAds.slice(-20).reverse();
  if(!last.length) return;
  const track = document.getElementById('tickerTrack');
  const items = last.map(a=>`<span class="t-item" onclick="showDetail('${a.id}')">🆕 <b>${esc(a.title)}</b> — ${esc(a.price)}</span>`).join('');
  track.innerHTML = items+items;
}

// ── Categories ──
function buildCats(){
  const container = document.getElementById('catsList');
  container.innerHTML='';
  const allBtn = makeEl('div','cat active',`الكل <span class="cnt">${allAds.length}</span>`);
  allBtn.dataset.cat='all';
  allBtn.onclick=()=>setCat('all');
  container.appendChild(allBtn);
  cats.forEach(cat=>{
    const count = allAds.filter(a=>a.category===cat).length;
    const icon  = CAT_ICONS[cat]||'🏷️';
    const btn   = makeEl('div','cat',`${icon} ${cat} <span class="cnt">${count}</span>`);
    btn.dataset.cat=cat;
    btn.onclick=()=>setCat(cat);
    container.appendChild(btn);
  });
}
function setCat(cat){
  curCat=cat;
  document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  renderAds(); updateFilters();
}

// ── Render Ads ──
function renderAds(){
  let filtered=[...allAds];
  if(curCat!=='all') filtered=filtered.filter(a=>a.category===curCat);
  if(curCity!=='all') filtered=filtered.filter(a=>a.city===curCity);
  if(curSearch.trim()){
    const q=curSearch.toLowerCase();
    filtered=filtered.filter(a=>(a.title&&a.title.toLowerCase().includes(q))||(a.description&&a.description.toLowerCase().includes(q))||(a.price&&a.price.toLowerCase().includes(q))||(a.city&&a.city.toLowerCase().includes(q)));
  }
  filtered.sort((a,b)=>{
    // المثبّتة أولاً دائماً
    if(b.pinned !== a.pinned) return (b.pinned?1:0)-(a.pinned?1:0);
    // ثم الأحدث بالـ id (طابع زمني)
    return parseInt(b.id||0) - parseInt(a.id||0);
  });
  const grid=document.getElementById('adsGrid');
  if(!filtered.length){grid.innerHTML='<div class="no-ads">📭 لا توجد إعلانات</div>';return;}
  grid.innerHTML=filtered.map(ad=>cardHTML(ad)).join('');
}

function cardHTML(ad){
  const imgs = ad.images||[];
  const icon = CAT_ICONS[ad.category]||'📦';
  let imgHTML = imgs.length
    ? `<div class="card-img"><img src="${imgs[0]}" alt="" loading="lazy"><div class="card-img-overlay"></div>${imgs.length>1?`<span class="img-count">📷 ${imgs.length}</span>`:''}</div>`
    : `<div class="card-img">${icon}</div>`;
  return `<div class="card${ad.pinned?' pinned':''}" onclick="showDetail('${ad.id}')">
    ${ad.pinned?'<div class="pin-tag">📌 مثبّت</div>':''}
    ${imgHTML}
    <div class="card-body">
      <div class="card-tags">
        <span class="tag tag-cat">${icon} ${esc(ad.category||'')}</span>
        ${ad.city?`<span class="tag tag-city">📍 ${esc(ad.city)}</span>`:''}
      </div>
      <div class="card-title">${esc(ad.title||'')}</div>
      <div class="card-price">💰 ${esc(ad.price||'')}</div>
      <div class="card-foot">
        <span class="card-date">📅 ${ad.date||''}</span>
        <div class="card-wa">💬</div>
      </div>
    </div>
  </div>`;
}

// ── Detail ──
function showDetail(id){
  const ad=allAds.find(a=>a.id===id); if(!ad) return;
  let ph=ad.contact.replace(/[\s\-\(\)]/g,'');
  if(ph.startsWith('0'))ph=ph.substring(1);
  if(!ph.startsWith('963'))ph='963'+ph;
  const waUrl=`https://wa.me/${ph}?text=${encodeURIComponent('مرحباً، أنا مهتم بالإعلان: '+ad.title)}`;
  const imgs=ad.images||[];
  let imgHTML='';
  if(imgs.length){
    imgHTML=`<div class="detail-imgs">
      <img class="main-img" id="mainImg" src="${imgs[0]}" onclick="showFull('${imgs[0]}')" alt="">
      ${imgs.length>1?`<div class="thumbs">${imgs.map((i,x)=>`<img class="thumb${x===0?' active':''}" src="${i}" onclick="switchImg('${i}',this)" alt="">`).join('')}</div>`:''}
    </div>`;
  } else {
    imgHTML=`<div class="no-img-box">${CAT_ICONS[ad.category]||'📦'}</div>`;
  }
  document.getElementById('detailTitle').textContent=ad.title||'';
  document.getElementById('detailBody').innerHTML=`
    ${imgHTML}
    <div class="detail-row"><div class="detail-lbl">📝 الوصف</div><div class="detail-val" style="line-height:1.8;white-space:pre-wrap">${linkify(ad.description||'')}</div></div>
    <div class="detail-row"><div class="detail-lbl">💰 السعر</div><div class="detail-val">${esc(ad.price||'')}</div></div>
    <div class="detail-row"><div class="detail-lbl">📍 المدينة</div><div class="detail-val">${esc(ad.city||'غير محدد')}</div></div>
    <div class="detail-row"><div class="detail-lbl">🏷️ التصنيف</div><div class="detail-val">${esc(ad.category||'')}</div></div>
    <div class="detail-row"><div class="detail-lbl">📅 تاريخ النشر</div><div class="detail-val">${ad.date||''}</div></div>
    ${ad.expiry_date?`<div class="detail-row"><div class="detail-lbl">⏰ ينتهي في</div><div class="detail-val">${ad.expiry_date}</div></div>`:''}
    <div class="detail-row"><div class="detail-lbl">🆔 رقم الإعلان</div><div class="detail-val" style="font-family:monospace;font-size:11px;color:var(--muted)">${ad.id}</div></div>
    <div class="contact-btns">
      <a href="${waUrl}" target="_blank" class="wa-btn">💬 تواصل عبر واتساب</a>
      <a href="tel:${ad.contact}" class="call-btn">📞 ${esc(ad.contact)}</a>
    </div>`;
  document.getElementById('detailModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function switchImg(src,el){
  document.getElementById('mainImg').src=src;
  document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
function showFull(src){
  document.getElementById('imgFullSrc').src=src;
  document.getElementById('imgFull').classList.add('open');
}

// ── Search ──
function openSearchModal(){document.getElementById('searchModal').classList.add('open');document.body.style.overflow='hidden';}
function applySearch(){
  curSearch=document.getElementById('sKeyword').value;
  curCity=document.getElementById('sCity').value;
  document.getElementById('headerSearch').value=curSearch;
  closeModal('searchModal');
  renderAds();updateFilters();
}
function resetSearch(){
  curSearch='';curCity='all';curCat='all';
  document.getElementById('sKeyword').value='';
  document.getElementById('sCity').value='all';
  document.getElementById('headerSearch').value='';
  document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat==='all'));
  closeModal('searchModal');
  renderAds();updateFilters();
}

// ── Filters UI ──
function updateFilters(){
  const c=document.getElementById('activeFilters');
  let f=[];
  if(curCat!=='all') f.push(`<span class="filter-chip">🏷️ ${curCat} <span class="rm" onclick="setCat('all')">✖</span></span>`);
  if(curCity!=='all') f.push(`<span class="filter-chip">📍 ${curCity} <span class="rm" onclick="rmCity()">✖</span></span>`);
  if(curSearch) f.push(`<span class="filter-chip">🔍 "${esc(curSearch)}" <span class="rm" onclick="rmSearch()">✖</span></span>`);
  c.innerHTML=f.join('');
}
function rmCity(){curCity='all';renderAds();updateFilters();}
function rmSearch(){curSearch='';document.getElementById('headerSearch').value='';renderAds();updateFilters();}

// ── Modals ──
function closeModal(id){
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow='auto';
}
function closeIfOut(e,id){if(e.target===document.getElementById(id))closeModal(id);}
function closeDetailIfOut(e){if(e.target===document.getElementById('detailModal'))closeModal('detailModal');}

// ── Helpers ──
function esc(s){if(!s)return'';return s.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');}
function linkify(text){
  if(!text) return '';
  // نعالج الروابط على النص الخام قبل esc
  const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
  const parts = text.split(urlRegex);
  return parts.map(function(part, i){
    if(urlRegex.test(part)){
      urlRegex.lastIndex = 0;
      const href = part.startsWith('http') ? part : 'https://' + part;
      return '<a href="javascript:void(0)" style="color:#f0b84a;text-decoration:underline;word-break:break-all;" onclick="event.stopPropagation();openExternalUrl(\'' + href + '\')">' + esc(part) + '</a>';
    }
    return esc(part);
  }).join('');
}
function makeEl(tag,cls,html){const el=document.createElement(tag);el.className=cls;el.innerHTML=html;return el;}
function toArabicNum(n){return n.toString().replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}

// فتح الروابط في المتصفح الخارجي
function openExternalUrl(url){
  try {
    // Android WebView bridge
    if(window.AndroidBridge && window.AndroidBridge.openUrl){
      window.AndroidBridge.openUrl(url);
    } else {
      // fallback: فتح في نافذة جديدة
      window.open(url, '_blank');
    }
  } catch(e){
    window.open(url, '_blank');
  }
}
loadData();
</script>
